name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: أنواع + بناء + اختبارات + أمان
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: فحص الأنواع (الكود والاختبارات)
        run: npm run typecheck

      - name: ملف setup_all.sql محدّث
        run: npm run db:check

      - name: ثغرات الحزم (production)
        run: npm audit --omit=dev --audit-level=moderate

      - name: ثغرات الحزم (كل شيء)
        run: npm audit --audit-level=high

      - name: الاختبارات (وحدة + مكوّنات + أمان ساكن + قاعدة بيانات وصلاحيات)
        run: npm test

      - name: البناء
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
